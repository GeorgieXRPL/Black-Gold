Step-by-Step Setup and Testing Guide
Part 1: Prerequisites
1.1 Install Dependencies
cd "/home/devbedevving/Desktop/Black Gold/black-gold"npm install
1.2 Get Devnet SOL
Go to https://faucet.solana.com/
Enter your wallet address
Request 2+ SOL for deployment and testing
1.3 Get/Create a Deployer Wallet
If you don't have one:
# Install Solana CLI if neededsh -c "$(curl -sSfL https://release.solana.com/stable/install)"# Create a new keypairsolana-keygen new -o deployer.json --no-bip39-passphrase# Get the public keysolana-keygen pubkey deployer.json# Airdrop devnet SOLsolana airdrop 2 $(solana-keygen pubkey deployer.json) --url devnet
1.4 Export Private Key as Base58
# Convert keypair to base58 for the deployment scriptcat deployer.json | node -e "const bs58 = require('bs58');const fs = require('fs');const keypair = JSON.parse(fs.readFileSync('/dev/stdin', 'utf8'));console.log(bs58.encode(Buffer.from(keypair)));"
Save this output - you'll need it for Step 2.
Part 2: Deploy Quarry Infrastructure (Devnet)
2.1 Run Deployment Script
cd "/home/devbedevving/Desktop/Black Gold/black-gold"# Replace with your base58 private key from step 1.4DEPLOYER_PRIVATE_KEY="your-base58-private-key-here" npx tsx scripts/deploy-quarry.ts
2.2 Save the Output
The script will output addresses like:
┌──────────────────────────────────────────────────────────────────────┐│ QUARRY_MINT_WRAPPER=ABC123...                                        ││ QUARRY_REWARDER_ADDRESS=DEF456...                                    ││ QUARRY_ADDRESS=GHI789...                                             ││ IOU_TOKEN_MINT=JKL012...                                             │└──────────────────────────────────────────────────────────────────────┘
Copy and save all these addresses!
Part 3: Create Environment Files
3.1 Create .env.local for Frontend (Next.js)
Create a file at black-gold/.env.local:
# NetworkNEXT_PUBLIC_SOLANA_NETWORK=devnetNEXT_PUBLIC_SOLANA_RPC_URL=https://api.devnet.solana.com# WebSocket ServerNEXT_PUBLIC_WS_URL=ws://localhost:8080NEXT_PUBLIC_API_PORT=8080# Quarry (from deployment output)NEXT_PUBLIC_QUARRY_ENABLED=trueNEXT_PUBLIC_QUARRY_REWARDER=<QUARRY_REWARDER_ADDRESS from step 2.2>NEXT_PUBLIC_QUARRY_ADDRESS=<QUARRY_ADDRESS from step 2.2>NEXT_PUBLIC_IOU_TOKEN_MINT=<IOU_TOKEN_MINT from step 2.2># Privy (get from dashboard.privy.io)NEXT_PUBLIC_PRIVY_APP_ID=your-privy-app-id# AdminNEXT_PUBLIC_ADMIN_SECRET=test-admin-secret
3.2 Create Server Environment
Export these in your terminal before running the server:
# Networkexport SOLANA_NETWORK=devnetexport SOLANA_RPC_URL=https://api.devnet.solana.com# Token (use your devnet COAL token or create one)export TOKEN_MINT_ADDRESS=9QWCzb5pMfkTFeLcWy9RJrBUqzBqE4dUPLnjcptchCf7# Quarry (from deployment output)export QUARRY_MINT_WRAPPER=<from step 2.2>export QUARRY_REWARDER_ADDRESS=<from step 2.2>export QUARRY_ADDRESS=<from step 2.2>export IOU_TOKEN_MINT=<from step 2.2># Escrow wallet (create a new one for testing)export BET_ESCROW_WALLET=<your-escrow-wallet-pubkey># Redeemer wallet (for IOU->COAL redemption)export REDEEMER_WALLET_ADDRESS=<your-redeemer-wallet-pubkey># Serverexport WEBSOCKET_PORT=8080export ADMIN_SECRET=test-admin-secret# Redis (optional - will use in-memory if not set)# export REDIS_URL=redis://localhost:6379
Part 4: Start the Application
4.1 Start the WebSocket Server
cd "/home/devbedevving/Desktop/Black Gold/black-gold"# With environment variables set from Part 3.2npm run server
You should see:
[Server] HTTP + WebSocket listening on port 8080[Server] Health check: http://localhost:8080/health[Server] Ready for miners!
4.2 Start the Frontend (New Terminal)
cd "/home/devbedevving/Desktop/Black Gold/black-gold"npm run dev
You should see:
▲ Next.js 16.1.1- Local: http://localhost:3000
Part 5: Test the Mining Flow
5.1 Connect Wallet
Open http://localhost:3000 in your browser
Click "Connect Wallet"
Use Privy to connect (email, social, or wallet)
5.2 Select a Mine
Click on a mine on the globe
Click "Set as Home"
Click "Start Mining"
5.3 Verify Mining Works
Hashrate should display
Timer should count down
Activity feed should show events
Part 6: Test Staking (Quarry)
6.1 Check Staking API
# Check if Quarry is configuredcurl http://localhost:8080/api/staking/config
Expected:
{  "available": true,  "network": "devnet",  "quarryAddress": "...",  "rewarderAddress": "...",  ...}
6.2 Build a Stake Transaction
curl -X POST http://localhost:8080/api/staking/stake \  -H "Content-Type: application/json" \  -d '{"walletAddress": "YOUR_WALLET_ADDRESS", "amount": 10}'
This returns a base64-encoded transaction for signing.
6.3 Test in Frontend
Open a mine's details panel
Click "Stake"
Enter amount and confirm
Sign the transaction in your wallet
Part 7: Test Bet Escrow (Raids)
7.1 Check Escrow API
curl http://localhost:8080/api/escrow/config
7.2 Build a Bet Deposit
curl -X POST http://localhost:8080/api/escrow/deposit \  -H "Content-Type: application/json" \  -d '{"walletAddress": "YOUR_WALLET", "amount": 50, "raidId": "test-raid-1"}'
7.3 Check User's Bets
curl http://localhost:8080/api/escrow/bets/YOUR_WALLET_ADDRESS
Part 8: Test Admin Console
8.1 Access Admin Console
Go to http://localhost:3000/admin
Enter password: test-admin-secret (from ADMIN_SECRET env var)
Click Login
8.2 Verify Dashboard
Should show real-time stats
Active miners count
Total hashrate
Mine status
8.3 Test Admin Actions
Try banning a test wallet
View logs
Check token configuration
Part 9: Verify On-Chain (Optional)
9.1 Check Solana Explorer
Go to https://explorer.solana.com/?cluster=devnet
Search for your transaction signatures
Verify transfers went to correct addresses
9.2 Check Quarry State
# Get your staking infocurl http://localhost:8080/api/staking/info/YOUR_WALLET_ADDRESS
Troubleshooting
"Quarry staking not configured"
Check that all QUARRY_* environment variables are set
Restart the server after setting variables
"Transaction failed"
Ensure you have devnet SOL for fees
Ensure you have devnet COAL tokens
Check the Solana Explorer for error details
"WebSocket disconnects"
Check server is running on correct port
Check NEXT_PUBLIC_WS_URL matches server
"Admin login fails"
Verify ADMIN_SECRET and NEXT_PUBLIC_ADMIN_SECRET match
Quick Test Checklist
[ ] Server starts without errors
[ ] Frontend loads at localhost:3000
[ ] Wallet connects successfully
[ ] Mining starts and shows hashrate
[ ] /api/staking/config returns available: true
[ ] /api/escrow/config returns configured escrow
[ ] Admin console authenticates
[ ] Admin dashboard shows real data
